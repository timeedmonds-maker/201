name: Probe NBA source maps for Hawk-Eye backend implementation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe_nba_sourcemaps_hawkeye.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/hawkeye-all-players-2025-26
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip -q install requests
      - name: Fetch candidate source maps and inspect embedded source
        run: |
          python - <<'PY'
          import requests,json,os,re,hashlib
          OUT='outputs/nba_hawkeye_sourcemaps'; os.makedirs(OUT,exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          jsurls=[
            'https://www.nba.com/_next/static/chunks/3245-01f19ec519c167ff.js',
            'https://www.nba.com/_next/static/chunks/15964-836461f8faac1d2a.js',
            'https://www.nba.com/_next/static/chunks/pages/inside-the-game-b0781697e3451234.js',
            'https://www.nba.com/_next/static/chunks/pages/_app-17641b50b12c156d.js'
          ]
          report=[]
          needles=['shotqualityleaders','shotqualityvideologs','shotqualityshotlog','36843','HANA_SOURCE','hanaService','stats.gleague.nba.com','stats.nba.com']
          for ju in jsurls:
            for mu in [ju+'.map',ju.rsplit('.js',1)[0]+'.js.map']:
              try:
                r=s.get(mu,timeout=30)
                rec={'js':ju,'map':mu,'status':r.status_code,'bytes':len(r.content),'ct':r.headers.get('content-type'),'sha256':hashlib.sha256(r.content).hexdigest()}
                if r.status_code==200:
                  try:j=r.json()
                  except:j=None
                  if isinstance(j,dict):
                    rec['keys']=list(j.keys()); rec['sources_count']=len(j.get('sources',[]))
                    hits=[]
                    for idx,src in enumerate(j.get('sourcesContent') or []):
                      if not isinstance(src,str):continue
                      lo=src.lower()
                      if any(n.lower() in lo for n in needles):
                        ctx=[]
                        for n in needles:
                          st=0
                          while True:
                            i=lo.find(n.lower(),st)
                            if i<0:break
                            ctx.append({'needle':n,'offset':i,'context':src[max(0,i-3000):i+8000]})
                            st=i+len(n)
                            if len(ctx)>40:break
                        hits.append({'index':idx,'source':j.get('sources',[None]*9999)[idx] if idx<len(j.get('sources',[])) else None,'contexts':ctx})
                    rec['hits']=hits
                report.append(rec)
              except Exception as e: report.append({'js':ju,'map':mu,'error':repr(e)})
              break
          json.dump(report,open(f'{OUT}/report.json','w'),indent=2)
          summary=[{'map':x.get('map'),'status':x.get('status'),'bytes':x.get('bytes'),'sources_count':x.get('sources_count'),'hit_sources':len(x.get('hits',[]))} for x in report]
          json.dump(summary,open(f'{OUT}/summary.json','w'),indent=2)
          print(json.dumps(summary,indent=2))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add outputs/nba_hawkeye_sourcemaps
          git commit -m 'Probe NBA Hawk-Eye source maps' || exit 0
          git pull --rebase origin analysis/hawkeye-all-players-2025-26
          git push origin HEAD:analysis/hawkeye-all-players-2025-26

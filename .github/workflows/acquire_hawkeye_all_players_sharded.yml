name: Sharded all-player 2025-26 Hawk-Eye season acquisition

on:
  push:
    branches: [analysis/hawkeye-all-players-2025-26]
    paths: ['.github/workflows/acquire_hawkeye_all_players_sharded.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: analysis/hawkeye-all-players-2025-26}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip -q install requests
      - name: Extract shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import csv,json,pathlib,requests,hashlib,time,random,os
          from concurrent.futures import ThreadPoolExecutor,as_completed
          S=int(os.environ['SHARD']); N=8
          SEASON='2025-26'; ST='Regular Season'; BASE='https://stats.gleague.nba.com/stats/'
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/137.0 Safari/537.36','Origin':'https://www.nba.com','Referer':'https://www.nba.com/','Accept':'application/json,text/plain,*/*','x-nba-stats-origin':'stats','x-nba-stats-token':'true'}
          def getj(resource,params,tries=7,timeout=45):
            last=None
            for a in range(tries):
              try:
                r=requests.get(BASE+resource,params=params,headers=H,timeout=timeout,allow_redirects=False)
                if r.status_code==200 and r.content:return r,r.json()
                last=f'HTTP {r.status_code}'
              except Exception as e:last=repr(e)
              time.sleep((.35*(2**a))+random.random()*.25)
            raise RuntimeError(last)
          lp={'LeagueID':'00','Season':SEASON,'SeasonType':ST,'PlayerOrTeam':'P','Counter':'0','Sorter':'DATE','Direction':'DESC','DateFrom':'','DateTo':''}
          lr,lj=getj('leaguegamelog',lp,tries=6,timeout=90)
          rs=lj.get('resultSets') or lj.get('resultSet'); rs=rs[0] if isinstance(rs,list) else rs
          hh=rs.get('headers') or []; rr=rs.get('rowSet') or []; ix={k:i for i,k in enumerate(hh)}
          pidk=next(k for k in ('PLAYER_ID','PERSON_ID') if k in ix); namek=next(k for k in ('PLAYER_NAME','PLAYER') if k in ix)
          P={}
          for row in rr:
            pid=str(row[ix[pidk]])
            p=P.setdefault(pid,{'player_id':pid,'player_name':row[ix[namek]],'league_fga':0,'player_game_rows':0,'teams':set(),'team_ids':set()})
            p['player_game_rows']+=1
            if 'FGA' in ix:
              try:p['league_fga']+=int(row[ix['FGA']] or 0)
              except:pass
            if 'TEAM_ABBREVIATION' in ix and row[ix['TEAM_ABBREVIATION']]:p['teams'].add(str(row[ix['TEAM_ABBREVIATION']]))
            if 'TEAM_ID' in ix and row[ix['TEAM_ID']] is not None:p['team_ids'].add(str(row[ix['TEAM_ID']]))
          ids=sorted(P,key=lambda x:int(x)); sel=[pid for i,pid in enumerate(ids) if i%N==S]
          def one(pid):
            p=P[pid]; base={'season':SEASON,'season_type':ST,'player_id':pid,'player_name':p['player_name'],'league_fga':p['league_fga'],'player_game_rows':p['player_game_rows'],'teams':'|'.join(sorted(p['teams'])),'team_ids':'|'.join(sorted(p['team_ids']))}
            try:
              r,j=getj('shotqualityleaders',{'LeagueID':'00','Season':SEASON,'SeasonType':ST,'PlayerID':pid},tries=7,timeout=30)
              rows=j.get('shots',[]) if isinstance(j,dict) else []; mm=[x for x in rows if str(x.get('PLAYERID'))==pid]; x=mm[0] if mm else (rows[0] if len(rows)==1 else None)
              if not x:return {**base,'query_status':'no_metric_row','http_status':r.status_code}
              return {**base,'query_status':'ok','http_status':r.status_code,'player_name_metric':x.get('PLAYERNAME'),'team_id_metric':x.get('TEAMID'),'team_abbreviation_metric':x.get('TEAMABBREVIATION'),'metric_fga':x.get('FGA'),'avg_defensive_hand_height':x.get('AVGDEFENSIVEHANDHEIGHT'),'avg_shooter_speed':x.get('AVGSHOOTERSPEED'),'avg_defender_pressure_score':x.get('AVGDEFENDERPRESSURESCORE'),'defensive_hand_height_rank':x.get('AVGDEFENSIVEHANDHEIGHT_RANK'),'shooter_speed_rank':x.get('AVGSHOOTERSPEED_RANK'),'defender_pressure_score_rank':x.get('AVGDEFENDERPRESSURESCORE_RANK'),'raw_sha256':hashlib.sha256(r.content).hexdigest()}
            except Exception as e:return {**base,'query_status':'error','error':repr(e)}
          out=[]
          with ThreadPoolExecutor(max_workers=2) as ex:
            fs={ex.submit(one,p):p for p in sel}
            for i,f in enumerate(as_completed(fs),1):
              out.append(f.result())
              if i%20==0:print('shard',S,i,'/',len(sel),flush=True)
          d=pathlib.Path('shard_out');d.mkdir(exist_ok=True)
          (d/f'shard_{S}.json').write_text(json.dumps(out,ensure_ascii=False),encoding='utf-8')
          (d/f'meta_{S}.json').write_text(json.dumps({'shard':S,'universe':len(P),'selected':len(sel),'league_rows':len(rr),'league_sha256':hashlib.sha256(lr.content).hexdigest()},indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hawkeye-shard-${{ matrix.shard }}
          path: shard_out/
          retention-days: 3

  merge:
    needs: extract
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: analysis/hawkeye-all-players-2025-26}
      - uses: actions/download-artifact@v4
        with:
          pattern: hawkeye-shard-*
          path: artifacts
      - name: Merge and validate
        run: |
          python - <<'PY'
          import csv,json,pathlib,collections,datetime
          root=pathlib.Path('artifacts'); rows=[]; metas=[]
          for p in root.glob('**/shard_*.json'): rows.extend(json.loads(p.read_text()))
          for p in root.glob('**/meta_*.json'): metas.append(json.loads(p.read_text()))
          d={str(r['player_id']):r for r in rows}; rows=list(d.values()); rows.sort(key=lambda r:(r.get('query_status')!='ok',-int(r.get('league_fga') or 0),r.get('player_name','')))
          universe=max([m.get('universe',0) for m in metas] or [0]); shooters=[r for r in rows if int(r.get('league_fga') or 0)>0]; zero=[r for r in rows if int(r.get('league_fga') or 0)==0]; ok=[r for r in rows if r.get('query_status')=='ok']; unresolved=[r for r in shooters if r.get('query_status')!='ok']
          nulls={m:sum(r.get(m) in (None,'') for r in ok) for m in ['avg_defensive_hand_height','avg_shooter_speed','avg_defender_pressure_score']}
          mism=[]
          for r in ok:
            try:
              if int(r.get('league_fga') or 0)!=int(r.get('metric_fga') or 0):mism.append({'player_id':r['player_id'],'player_name':r['player_name'],'league_fga':r.get('league_fga'),'metric_fga':r.get('metric_fga')})
            except:pass
          out=pathlib.Path('outputs/hawkeye_2025_26_all_players_sharded');out.mkdir(parents=True,exist_ok=True)
          fields=[];seen=set()
          for r in rows:
            for k in r:
              if k not in seen:seen.add(k);fields.append(k)
          with (out/'player_season_hawkeye_all_players.csv').open('w',newline='',encoding='utf-8') as f:
            w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(rows)
          (out/'player_season_hawkeye_all_players.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False),encoding='utf-8')
          summary={'season':'2025-26','season_type':'Regular Season','source_universe':'NBA leaguegamelog PlayerOrTeam=P','source_metrics':'NBA shotqualityleaders individual PlayerID queries','retrieved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'shards_found':len(metas),'expected_universe_player_count':universe,'merged_player_count':len(rows),'players_with_fga':len(shooters),'players_with_zero_fga':len(zero),'metric_rows_recovered':len(ok),'shooters_unresolved_count':len(unresolved),'coverage_of_players_with_fga_pct':round(100*sum(r.get('query_status')=='ok' for r in shooters)/len(shooters),4) if shooters else None,'null_metric_counts_among_recovered':nulls,'fga_mismatch_count':len(mism),'fga_mismatches':mism,'unresolved_shooters':unresolved,'zero_fga_players':zero,'meta':metas}
          (out/'summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps({k:v for k,v in summary.items() if k not in ('fga_mismatches','unresolved_shooters','zero_fga_players','meta')},indent=2))
          if len(metas)!=8: raise SystemExit(f'missing shards {len(metas)}')
          if len(rows)!=universe: raise SystemExit(f'merged {len(rows)} != universe {universe}')
          if unresolved: raise SystemExit(f'unresolved shooters {len(unresolved)}')
          if any(nulls.values()): raise SystemExit(f'null metrics {nulls}')
          PY
      - name: Commit durable output
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add outputs/hawkeye_2025_26_all_players_sharded || true
          git diff --cached --quiet && exit 0
          git commit -m 'Preserve sharded all-player 2025-26 Hawk-Eye season metrics'
          git pull --rebase origin analysis/hawkeye-all-players-2025-26
          git push origin HEAD:analysis/hawkeye-all-players-2025-26
